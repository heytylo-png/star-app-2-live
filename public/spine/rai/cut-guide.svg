<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-label="Layer cut guide for Star Rai idle, schematic not official art">
  <title>Star Rai idle  layer cut guide (schematic)</title>
  <desc>Boxes and labels for cutting public/rai/idle.png into Spine/cutout parts. This drawing is a proportion schematic, not a tracing of the official sheet.</desc>
  <rect width="720" height="1280" fill="#efece6"/>
  <text x="36" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#1c1916">Idle cut guide · schematic</text>
  <text x="36" y="74" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#6d675f">Source: public/rai/idle.png (1008×1792). Normalize to 720×1280 in Spine. Hip origin ~72% down the figure.</text>

  <!-- ground / shadow -->
  <ellipse cx="360" cy="1188" rx="90" ry="16" fill="#d9d3c8"/>

  <!-- socks + shoes -->
  <rect x="318" y="980" width="36" height="160" rx="16" fill="#1c2c48"/>
  <rect x="366" y="980" width="36" height="160" rx="16" fill="#1c2c48"/>
  <ellipse cx="334" cy="1162" rx="28" ry="14" fill="#6b3c28"/>
  <ellipse cx="386" cy="1162" rx="28" ry="14" fill="#6b3c28"/>

  <!-- legs -->
  <rect x="314" y="780" width="40" height="210" rx="18" fill="#d08b5c"/>
  <rect x="366" y="780" width="40" height="210" rx="18" fill="#d08b5c"/>

  <!-- skirt -->
  <polygon points="300,730 420,730 455,820 265,820" fill="#1c2c48"/>
  <rect x="268" y="808" width="184" height="10" fill="#f4f0e8"/>

  <!-- arms hanging -->
  <rect x="238" y="430" width="32" height="210" rx="16" fill="#d08b5c"/>
  <rect x="450" y="430" width="32" height="210" rx="16" fill="#d08b5c"/>
  <ellipse cx="254" cy="655" rx="16" ry="18" fill="#c47b4e"/>
  <ellipse cx="466" cy="655" rx="16" ry="18" fill="#c47b4e"/>

  <!-- torso -->
  <rect x="292" y="390" width="136" height="350" rx="28" fill="#f6f3ec" stroke="#cfc6b6"/>
  <circle cx="360" cy="470" r="7" fill="#c4a574"/>
  <circle cx="360" cy="510" r="7" fill="#c4a574"/>
  <circle cx="360" cy="550" r="7" fill="#c4a574"/>
  <!-- bow -->
  <polygon points="328,412 358,400 358,428" fill="#c4162e"/>
  <polygon points="392,412 362,400 362,428" fill="#c4162e"/>

  <!-- neck + head -->
  <rect x="342" y="338" width="36" height="58" rx="12" fill="#d08b5c"/>
  <ellipse cx="360" cy="270" rx="78" ry="88" fill="#d08b5c"/>
  <!-- hair -->
  <ellipse cx="360" cy="214" rx="92" ry="70" fill="#1a1614"/>
  <ellipse cx="286" cy="290" rx="28" ry="48" fill="#1a1614"/>
  <ellipse cx="434" cy="292" rx="26" ry="46" fill="#1a1614"/>
  <!-- ahoge -->
  <path d="M330 148 C 318 110, 348 72, 392 88" fill="none" stroke="#1a1614" stroke-width="10" stroke-linecap="round"/>
  <!-- face marks -->
  <ellipse cx="332" cy="268" rx="10" ry="12" fill="#fff"/>
  <ellipse cx="388" cy="268" rx="10" ry="12" fill="#fff"/>
  <ellipse cx="334" cy="270" rx="5" ry="7" fill="#e8a31c"/>
  <ellipse cx="390" cy="270" rx="5" ry="7" fill="#e8a31c"/>
  <rect x="344" y="312" width="32" height="6" rx="3" fill="#6d675f"/>

  <!-- cut boxes -->
  <g fill="none" stroke="#1c1916" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.85">
    <rect x="268" y="70" width="90" height="110" rx="8"/>
    <rect x="268" y="168" width="184" height="150" rx="8"/>
    <rect x="300" y="330" width="120" height="70" rx="8"/>
    <rect x="286" y="384" width="148" height="340" rx="8"/>
    <rect x="318" y="392" width="84" height="52" rx="8"/>
    <rect x="220" y="400" width="70" height="280" rx="8"/>
    <rect x="430" y="400" width="70" height="280" rx="8"/>
    <rect x="250" y="700" width="220" height="130" rx="8"/>
    <rect x="300" y="770" width="52" height="220" rx="8"/>
    <rect x="368" y="770" width="52" height="220" rx="8"/>
    <rect x="300" y="980" width="52" height="200" rx="8"/>
    <rect x="368" y="980" width="52" height="200" rx="8"/>
  </g>

  <!-- labels -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#1c1916">
    <text x="470" y="120">ahoge</text>
    <text x="470" y="210">hair front / back</text>
    <text x="470" y="250">head + brow</text>
    <text x="470" y="370">neck</text>
    <text x="470" y="430">bow</text>
    <text x="470" y="560">torso (sleeves off)</text>
    <text x="40" y="520">arm R</text>
    <text x="40" y="540">(wave / scold)</text>
    <text x="520" y="640">arm L</text>
    <text x="40" y="760">skirt (mesh later)</text>
    <text x="40" y="880">thigh L / R</text>
    <text x="40" y="1080">calf + sock</text>
    <text x="470" y="1160">foot / loafer</text>
  </g>
  <text x="36" y="1248" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6d675f">Overlap 816px at joints. Punch studio-white to alpha. scold ` shy ` pout (face + arm, not new legs).</text>
</svg>
