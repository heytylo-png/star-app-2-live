name = "star-rai-grok-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
# Comma-separated origins allowed to use the proxy. Requests from any other
# origin (or with no Origin header) are refused with 403.
# Leave unset for the built-in default (the Pages site + local Vite).
# Set to "*" only if you really want an open proxy.
ALLOWED_ORIGINS = "https://heytylo-png.github.io,http://localhost:5173,http://127.0.0.1:5173"
